upstream auth_service {
    server auth:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # ---- auth service ----
    location /api/ {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # The assistant's replies arrive as an event stream. HTTP/1.0 to the
        # upstream cannot carry one, and buffering would hold it back until the
        # model had finished — which is the same thing as not streaming at all.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /login     { proxy_pass http://auth_service; }
    location = /register  { proxy_pass http://auth_service; }
    location = /admin     { proxy_pass http://auth_service; }
    location = /standards { proxy_pass http://auth_service; }
    location = /theme.css { proxy_pass http://auth_service; }

    # Internal subrequest target for auth_request
    location = /__auth_check {
        internal;
        proxy_pass http://auth_service/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @need_login {
        return 302 /login?next=$request_uri;
    }

    # ---- members-only viewer apps ----
    location /cad-viewer/ {
        auth_request /__auth_check;
        error_page 401 = @need_login;
        try_files $uri $uri/ =404;

        # auth_request is inherited by this nested location
        location ~* \.(js|css|wasm|woff2?|png|jpg|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    location /cad-simple-viewer/ {
        auth_request /__auth_check;
        error_page 401 = @need_login;
        try_files $uri $uri/ =404;

        location ~* \.(js|css|wasm|woff2?|png|jpg|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # The product is the editor, so the root goes there rather than to a
    # landing page. Unauthenticated visitors are bounced on to /login by the
    # auth check below, which makes the whole entry flow a single path:
    # / → login → editor.
    location = / {
        return 302 /cad-viewer/;
    }

    # ---- public: docs, cdn-bootstrap example, landing page at /index.html ----
    location / {
        try_files $uri $uri/ =404;
    }
}
