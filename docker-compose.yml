services:
  cad-viewer:
    build: .
    image: cad-viewer:latest
    container_name: cad-viewer
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped
    depends_on:
      - auth
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    build: ./server/auth
    image: cad-viewer-auth:latest
    container_name: cad-viewer-auth
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Optional. Without it the AI routes answer 503 saying so, and every
      # other feature works unchanged — the assistant is an accelerator on a
      # product that already does its job without one.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
    volumes:
      - auth-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  auth-data:
