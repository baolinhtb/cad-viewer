<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — CAD Viewer</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* The reset, body and .panel rules live in theme.css. */
  body { display: flex; align-items: center; justify-content: center; }
  .card { padding: 32px; width: 100%; max-width: 380px; margin: 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; font-weight: 600; }
  .sub { color: var(--cv-ink-secondary); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--cv-ink-secondary); }
  input {
    width: 100%; padding: 9px 12px; font-size: 14px;
    background: var(--cv-surface-canvas);
    border: 1px solid var(--cv-border-hairline);
    border-radius: var(--cv-radius-md);
    color: var(--cv-ink-primary);
  }
  input:focus { outline: 2px solid var(--cv-accent); outline-offset: 0; border-color: transparent; }
  /* The accent is reserved for the one action the page exists for. */
  button {
    width: 100%; margin-top: 22px; padding: 10px; border: 0;
    border-radius: var(--cv-radius-md);
    background: var(--cv-accent); color: var(--cv-accent-foreground);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  .msg {
    margin-top: 14px; font-size: 13px; padding: 9px 12px;
    border-radius: var(--cv-radius-md); display: none;
    border: 1px solid transparent;
  }
  .msg.error { display: block; color: var(--cv-danger); border-color: var(--cv-danger); background: rgba(242,109,91,.1); }
  .msg.info { display: block; color: var(--cv-selection); border-color: var(--cv-selection); background: rgba(84,169,255,.1); }
  .foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--cv-ink-secondary); }
  a { color: var(--cv-selection); }
</style>
</head>
<body>
<div class="card panel">
  <h1>Đăng nhập</h1>
  <p class="sub">CAD Viewer — dành cho thành viên đã kích hoạt</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button id="btn" type="submit">Đăng nhập</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="foot">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
</div>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn')
// Where to go once signed in. `next` carries the page the user was trying to
// reach; without it, land straight in the editor — that is what people log in
// to do, and a landing page in between is a click that never earns itself.
// The `//` check keeps `next` from being used to bounce to another site.
const HOME = '/cad-viewer/'
const next = new URLSearchParams(location.search).get('next')
const dest = next && next.startsWith('/') && !next.startsWith('//') ? next : HOME
f.addEventListener('submit', async e => {
  e.preventDefault()
  btn.disabled = true
  msg.className = 'msg'
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    })
    const data = await r.json()
    if (r.ok) {
      location.href = dest
      return
    }
    msg.textContent = data.error || 'Đăng nhập thất bại.'
    msg.className = 'msg error'
  } catch {
    msg.textContent = 'Không kết nối được máy chủ.'
    msg.className = 'msg error'
  }
  btn.disabled = false
})
</script>
</body>
</html>
