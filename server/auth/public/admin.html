<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị thành viên — CAD Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; min-height: 100vh; }
  header { background: #fff; border-bottom: 1px solid #e2e2e2; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; }
  .who { font-size: 14px; color: #555; }
  .who button { margin-left: 12px; padding: 6px 14px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .panel { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #fafafa; font-size: 13px; color: #555; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge.pending { background: #fef3cd; color: #8a6d00; }
  .badge.active { background: #e6f4ea; color: #137333; }
  .badge.disabled { background: #fdecea; color: #b3261e; }
  .badge.admin { background: #e8f0fe; color: #1a4fba; }
  td button { padding: 6px 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button.act { background: #137333; color: #fff; }
  button.deact { background: #fdecea; color: #b3261e; }
  .empty { padding: 32px; text-align: center; color: #888; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Quản trị thành viên</h1>
  <div class="who"><span id="who"></span><button id="logout">Đăng xuất</button></div>
</header>
<main>
  <div class="panel">
    <table>
      <thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày đăng ký</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Chưa có thành viên nào.</div>
  </div>
</main>
<div id="toast" class="toast"></div>
<script>
const rows = document.getElementById('rows')
let me = null

function toast(text) {
  const t = document.getElementById('toast')
  t.textContent = text
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

async function api(path, opts) {
  const r = await fetch(path, opts)
  if (r.status === 401) { location.href = '/login?next=/admin'; throw new Error('unauthorized') }
  return r
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// Roles are shown and set separately from activation: one answers "may this
// person in at all", the other "how far are they trusted once inside".
const ROLE_LABEL = {
  member: 'Thành viên',
  author: 'Tác giả template',
  admin: 'Quản trị'
}

function render(users) {
  document.getElementById('empty').style.display = users.length ? 'none' : 'block'
  rows.innerHTML = users.map(u => {
    const status = { pending: '<span class="badge pending">Chờ kích hoạt</span>',
      active: '<span class="badge active">Đã kích hoạt</span>',
      disabled: '<span class="badge disabled">Vô hiệu hóa</span>' }[u.status] ?? ''

    const roleCell = `<select class="role" data-id="${u.id}">` +
      Object.entries(ROLE_LABEL).map(([value, label]) =>
        `<option value="${value}"${u.role === value ? ' selected' : ''}>${label}</option>`
      ).join('') + '</select>'

    const action = u.role === 'admin' ? '' : (u.status === 'active'
      ? `<button class="deact" data-id="${u.id}" data-a="deactivate">Vô hiệu hóa</button>`
      : `<button class="act" data-id="${u.id}" data-a="activate">Kích hoạt</button>`)

    return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${roleCell}</td><td>${status}</td><td>${esc(u.created_at)}</td><td>${action}</td></tr>`
  }).join('')
}

rows.addEventListener('change', async event => {
  const select = event.target.closest('select.role')
  if (!select) return
  const previous = select.dataset.previous
  const response = await api(`/api/admin/users/${select.dataset.id}/role`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: select.value })
  })
  if (!response.ok) {
    const body = await response.json().catch(() => ({}))
    alert(body.error || 'Không đổi được vai trò.')
    if (previous) select.value = previous
    return
  }
  await load()
})

async function load() {
  const r = await api('/api/admin/users')
  if (r.status === 403) { document.body.innerHTML = '<main><div class="panel empty">Bạn không có quyền truy cập trang này.</div></main>'; return }
  render((await r.json()).users)
}

rows.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]')
  if (!b) return
  b.disabled = true
  const r = await api(`/api/admin/users/${b.dataset.id}/${b.dataset.a}`, { method: 'POST' })
  const data = await r.json()
  toast(r.ok ? (b.dataset.a === 'activate' ? 'Đã kích hoạt' : 'Đã vô hiệu hóa') : (data.error || 'Lỗi'))
  load()
})

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' })
  location.href = '/login'
})

api('/api/auth/me').then(async r => {
  if (r.ok) {
    me = await r.json()
    document.getElementById('who').textContent = me.email
    load()
  }
})
</script>
</body>
</html>
