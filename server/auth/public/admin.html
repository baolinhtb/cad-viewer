<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị thành viên — CAD Viewer</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* The reset, body and .panel rules live in theme.css. */
  header {
    background: var(--cv-surface-panel);
    border-bottom: 1px solid var(--cv-border-hairline);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .who { font-size: 13px; color: var(--cv-ink-secondary); }
  .who button {
    margin-left: 12px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--cv-border-hairline);
    border-radius: var(--cv-radius-md);
    background: var(--cv-surface-raised); color: var(--cv-ink-primary);
  }
  /* A native select keeps the platform's own light chrome unless every part
     of it is named, and one bright control in a dark table is the thing the
     eye goes to first. */
  select {
    padding: 4px 8px; font-size: 12px; font-family: inherit; cursor: pointer;
    background: var(--cv-surface-canvas); color: var(--cv-ink-primary);
    border: 1px solid var(--cv-border-hairline);
    border-radius: var(--cv-radius-md);
  }
  select:disabled { color: var(--cv-ink-disabled); cursor: default; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .panel { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left; padding: 10px 16px; white-space: nowrap;
    border-bottom: 1px solid var(--cv-border-hairline);
  }
  th { background: var(--cv-surface-raised); font-size: 12px; font-weight: 600; color: var(--cv-ink-secondary); }
  tr:last-child td { border-bottom: 0; }
  /* Emails, dates and roles are exact values, so they take the mono face. */
  td.data { font-family: var(--cv-font-mono); font-variant-numeric: tabular-nums; }
  /* Status reads from the outline, not a filled pill: a table of filled
     badges competes with the one action in each row. */
  .badge {
    display: inline-block; padding: 2px 9px; font-size: 11px; font-weight: 600;
    border-radius: var(--cv-radius-sm); border: 1px solid currentColor;
  }
  .badge.pending { color: var(--cv-warning); }
  .badge.active { color: var(--cv-accent); }
  .badge.disabled { color: var(--cv-danger); }
  .badge.admin { color: var(--cv-selection); }
  td button {
    padding: 5px 12px; border: 1px solid currentColor; font-size: 12px;
    font-weight: 600; cursor: pointer; background: transparent;
    border-radius: var(--cv-radius-md);
  }
  button.act { color: var(--cv-accent); }
  button.deact { color: var(--cv-danger); }
  .empty { padding: 32px; text-align: center; color: var(--cv-ink-disabled); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--cv-surface-raised); color: var(--cv-ink-primary);
    border: 1px solid var(--cv-border-hairline);
    padding: 9px 18px; border-radius: var(--cv-radius-md); font-size: 13px;
    opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Quản trị thành viên</h1>
  <div class="who"><span id="who"></span><button id="logout">Đăng xuất</button></div>
</header>
<main>
  <div class="panel">
    <table>
      <thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày đăng ký</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Chưa có thành viên nào.</div>
  </div>
</main>
<div id="toast" class="toast"></div>
<script>
const rows = document.getElementById('rows')
let me = null

function toast(text) {
  const t = document.getElementById('toast')
  t.textContent = text
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

async function api(path, opts) {
  const r = await fetch(path, opts)
  if (r.status === 401) { location.href = '/login?next=/admin'; throw new Error('unauthorized') }
  return r
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// Roles are shown and set separately from activation: one answers "may this
// person in at all", the other "how far are they trusted once inside".
const ROLE_LABEL = {
  member: 'Thành viên',
  author: 'Tác giả template',
  admin: 'Quản trị'
}

function render(users) {
  document.getElementById('empty').style.display = users.length ? 'none' : 'block'
  rows.innerHTML = users.map(u => {
    const status = { pending: '<span class="badge pending">Chờ kích hoạt</span>',
      active: '<span class="badge active">Đã kích hoạt</span>',
      disabled: '<span class="badge disabled">Vô hiệu hóa</span>' }[u.status] ?? ''

    const roleCell = `<select class="role" data-id="${u.id}">` +
      Object.entries(ROLE_LABEL).map(([value, label]) =>
        `<option value="${value}"${u.role === value ? ' selected' : ''}>${label}</option>`
      ).join('') + '</select>'

    const action = u.role === 'admin' ? '' : (u.status === 'active'
      ? `<button class="deact" data-id="${u.id}" data-a="deactivate">Vô hiệu hóa</button>`
      : `<button class="act" data-id="${u.id}" data-a="activate">Kích hoạt</button>`)

    return `<tr><td>${esc(u.name)}</td><td class="data">${esc(u.email)}</td><td>${roleCell}</td><td>${status}</td><td class="data">${esc(u.created_at)}</td><td>${action}</td></tr>`
  }).join('')
}

rows.addEventListener('change', async event => {
  const select = event.target.closest('select.role')
  if (!select) return
  const previous = select.dataset.previous
  const response = await api(`/api/admin/users/${select.dataset.id}/role`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: select.value })
  })
  if (!response.ok) {
    const body = await response.json().catch(() => ({}))
    alert(body.error || 'Không đổi được vai trò.')
    if (previous) select.value = previous
    return
  }
  await load()
})

async function load() {
  const r = await api('/api/admin/users')
  if (r.status === 403) { document.body.innerHTML = '<main><div class="panel empty">Bạn không có quyền truy cập trang này.</div></main>'; return }
  render((await r.json()).users)
}

rows.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]')
  if (!b) return
  b.disabled = true
  const r = await api(`/api/admin/users/${b.dataset.id}/${b.dataset.a}`, { method: 'POST' })
  const data = await r.json()
  toast(r.ok ? (b.dataset.a === 'activate' ? 'Đã kích hoạt' : 'Đã vô hiệu hóa') : (data.error || 'Lỗi'))
  load()
})

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' })
  location.href = '/login'
})

api('/api/auth/me').then(async r => {
  if (r.ok) {
    me = await r.json()
    document.getElementById('who').textContent = me.email
    load()
  }
})
</script>
</body>
</html>
