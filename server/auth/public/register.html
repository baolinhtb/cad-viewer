<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — CAD Viewer</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* The reset, body and .panel rules live in theme.css. */
  body { display: flex; align-items: center; justify-content: center; }
  .card { padding: 32px; width: 100%; max-width: 380px; margin: 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; font-weight: 600; }
  .sub { color: var(--cv-ink-secondary); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--cv-ink-secondary); }
  input {
    width: 100%; padding: 9px 12px; font-size: 14px;
    background: var(--cv-surface-canvas);
    border: 1px solid var(--cv-border-hairline);
    border-radius: var(--cv-radius-md);
    color: var(--cv-ink-primary);
  }
  input:focus { outline: 2px solid var(--cv-accent); outline-offset: 0; border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 10px; border: 0;
    border-radius: var(--cv-radius-md);
    background: var(--cv-accent); color: var(--cv-accent-foreground);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  .msg {
    margin-top: 14px; font-size: 13px; padding: 9px 12px;
    border-radius: var(--cv-radius-md); display: none;
    border: 1px solid transparent;
  }
  .msg.error { display: block; color: var(--cv-danger); border-color: var(--cv-danger); background: rgba(242,109,91,.1); }
  .msg.ok { display: block; color: var(--cv-accent); border-color: var(--cv-accent); background: rgba(53,224,161,.1); }
  .foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--cv-ink-secondary); }
  a { color: var(--cv-selection); }
</style>
</head>
<body>
<div class="card panel">
  <h1>Đăng ký thành viên</h1>
  <p class="sub">Tài khoản sẽ dùng được sau khi quản trị viên kích hoạt</p>
  <form id="f">
    <label for="name">Họ tên</label>
    <input id="name" type="text" required maxlength="100">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Mật khẩu (tối thiểu 8 ký tự)</label>
    <input id="password" type="password" required minlength="8" autocomplete="new-password">
    <label for="confirm">Nhập lại mật khẩu</label>
    <input id="confirm" type="password" required autocomplete="new-password">
    <button id="btn" type="submit">Đăng ký</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="foot">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
</div>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn')
f.addEventListener('submit', async e => {
  e.preventDefault()
  msg.className = 'msg'
  const password = document.getElementById('password').value
  if (password !== document.getElementById('confirm').value) {
    msg.textContent = 'Mật khẩu nhập lại không khớp.'
    msg.className = 'msg error'
    return
  }
  btn.disabled = true
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password
      })
    })
    const data = await r.json()
    if (r.ok) {
      f.style.display = 'none'
      msg.textContent = data.message
      msg.className = 'msg ok'
      return
    }
    msg.textContent = data.error || 'Đăng ký thất bại.'
    msg.className = 'msg error'
  } catch {
    msg.textContent = 'Không kết nối được máy chủ.'
    msg.className = 'msg error'
  }
  btn.disabled = false
})
</script>
</body>
</html>
